version: "1"

default: dev

tasks:
  # Build, lint, and test on source changes
  dev:
    deps: [build, lint, test]
    sources: go

  # Build the binary
  build:
    cmd: go build -trimpath -ldflags "-s -w" -o bin/gogo .
    sources: go

  # Run tests
  test:
    cmd: go test -race -count=1 ./...
    sources: go

  # Run linters
  lint:
    deps: [lint:custom]
    cmd: golangci-lint run
    sources: [go, .golangci.yml]

  # Run gogo's project-specific cops (rubocop-go). Lives in its own nested
  # module under tools/gogolint so rubocop-go's x/tools dependency stays out
  # of gogo's own go.mod (and off govulncheck's radar).
  lint:custom:
    dir: tools/gogolint
    cmd: go run . ../..
    sources: [go, tools/gogolint/**/*.go]

  # Format Go source files
  format:
    cmd: goimports -w .
    sources: [go, .golangci.yml]

  # Cross-compile for all platforms
  cross:
    cmd: |
      set -e
      mkdir -p dist
      for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
        os=${target%/*}
        arch=${target#*/}
        ext=
        if [ "$os" = windows ]; then
          ext=.exe
        fi
        CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "dist/gogo-$os-$arch$ext" .
      done

  # Install gogo on the path
  install:
    cmd: go install

  # Remove build artifacts
  clean:
    cmd: rm -rf bin dist
