version: "1"

sources:
  lint: [go, .golangci.yml]

tasks:
  # Build, lint, and test
  default:
    deps: [build, lint, test]

  # Build, lint, and test on source changes
  dev:
    deps: [build, lint, test]
    sources: go

  # Build the binary
  build:
    cmd: go build -trimpath -ldflags "-s -w" -o bin/gogo .
    sources: go

  # Remove build artifacts
  clean:
    cmd: rm -rf bin

  # Run linters
  lint:
    cmd: golangci-lint run
    sources: lint

  # Run tests
  test:
    cmd: go test ./...
    sources: go

  # Format Go source files
  format:
    cmd: goimports -w .
    sources: "**/*.go"

  # Cross-compile for all platforms
  build-cross:
    cmd: >
      docker buildx build
      --target=cross
      --platform linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64,windows/arm64
      .

  # Install gogo on the path
  install:
    cmd: go install